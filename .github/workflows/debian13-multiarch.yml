name: Publish Debian13 Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "workspaces/Debian13-Docker/**"
      - ".github/workflows/debian13-multiarch.yml"
  pull_request:
    paths:
      - "workspaces/Debian13-Docker/**"
      - ".github/workflows/debian13-multiarch.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/debian13-docker
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build amd64/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: workspaces/Debian13-Docker
          file: workspaces/Debian13-Docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

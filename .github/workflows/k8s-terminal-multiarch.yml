name: Publish K8s Terminal Image

on:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - "workspaces/Kubernetes-Terminal/**"
      - ".github/workflows/k8s-terminal-multiarch.yml"
  pull_request:
    paths:
      - "workspaces/Kubernetes-Terminal/**"
      - ".github/workflows/k8s-terminal-multiarch.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kasm_version: '1.18.0'
            image_tag: '1.18.0'
          - kasm_version: '1.19.0'
            image_tag: '1.19.0'
            latest: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/k8s-terminal
          tags: |
            type=raw,value=${{ matrix.image_tag }}
            ${{ matrix.latest && 'type=raw,value=latest' || '' }}
            type=sha,prefix=${{ matrix.image_tag }}-

      - name: Build amd64/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: workspaces/Kubernetes-Terminal
          file: workspaces/Kubernetes-Terminal/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            KASM_VERSION=${{ matrix.kasm_version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
